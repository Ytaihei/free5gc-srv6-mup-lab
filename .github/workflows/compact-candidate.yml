name: Compact image candidate (never publishes)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compact-image-candidate
  cancel-in-progress: false

jobs:
  candidate:
    # Opt-in only. Never execute PR code on a privileged/self-hosted runner.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.COMPACT_CANDIDATE_CI == 'enabled'
    environment: compact-candidate
    runs-on: [self-hosted, linux, x64, srv6-mup-release]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A dedicated one-job runner is required; never clean retained state.
          clean: false
      - name: Check source and create a fresh isolated candidate
        env:
          CANDIDATE_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          make check
          python3 scripts/compact_ci.py "$CANDIDATE_RUN"
      # No upload-artifact, registry login, packages:write, or publication step.
      # Image archives and raw evidence stay private in the retained workspace.

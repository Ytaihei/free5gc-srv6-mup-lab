name: Secret scan

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up manifest reader
        run: python3 -m pip install PyYAML==6.0.3

      - name: Scan repository history
        run: ./scripts/verification-tool.sh gitleaks git --redact --config .gitleaks.toml --log-opts='--all' .

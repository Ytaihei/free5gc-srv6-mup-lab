lab_config: "{{ lookup('ansible.builtin.file', lab_config_file) | from_yaml }}"

lab_repo_local: >-
  {{ lookup('ansible.builtin.env', 'LAB_REPO_LOCAL')
     | default(playbook_dir | dirname, true) }}
host_networks:
  core:
    - {interface: enp2s0, addresses: ["{{ lab_config.networks.n2.amf_ipv4 }}/{{ lab_config.networks.n2.subnet.split('/')[1] }}"], externally_owned: true}
    - {interface: enp3s0, addresses: ["{{ lab_config.networks.n3_core.upf_ipv4 }}/{{ lab_config.networks.n3_core.subnet.split('/')[1] }}"], externally_owned: true}
    - {interface: enp4s0, addresses: ["{{ lab_config.networks.n6.upf_ipv4 }}/{{ lab_config.networks.n6.subnet.split('/')[1] }}"], externally_owned: true}
  ran:
    - {interface: enp2s0, addresses: ["{{ lab_config.networks.n2.gnb_ipv4 }}/{{ lab_config.networks.n2.subnet.split('/')[1] }}"]}
    - interface: enp3s0
      addresses: ["{{ lab_config.networks.n3_access.gnb_ipv4 }}/{{ lab_config.networks.n3_access.subnet.split('/')[1] }}"]
      routes:
        - {to: "{{ lab_config.networks.n3_core.upf_ipv4 }}/32", via: "{{ lab_config.networks.n3_access.tpe_ipv4 }}"}
  tpe:
    - {interface: enp2s0, addresses: ["{{ lab_config.networks.n3_access.tpe_ipv4 }}/{{ lab_config.networks.n3_access.subnet.split('/')[1] }}"]}
    - interface: enp3s0
      addresses: ["{{ lab_config.networks.sr_underlay.tpe_ipv6 }}/{{ lab_config.networks.sr_underlay.subnet.split('/')[1] }}"]
      routes:
        - {to: "{{ lab_config.networks.sr_underlay.npe_locator }}", via: "{{ lab_config.networks.sr_underlay.npe_ipv6 }}"}
    # This NIC may occupy a different PCI slot when added to an older lab VM.
    # Match its reconciler-owned MAC and give it a stable in-guest name.
    - {interface: n3b0, match_mac: "{{ lab_config.nodes.tpe.n3_core_mac }}", addresses: ["{{ lab_config.networks.n3_core.tpe_ipv4 }}/{{ lab_config.networks.n3_core.subnet.split('/')[1] }}"]}
  npe:
    - interface: enp2s0
      addresses: ["{{ lab_config.networks.sr_underlay.npe_ipv6 }}/{{ lab_config.networks.sr_underlay.subnet.split('/')[1] }}"]
      routes:
        - {to: "{{ lab_config.networks.sr_underlay.tpe_locator }}", via: "{{ lab_config.networks.sr_underlay.tpe_ipv6 }}"}
    - interface: enp3s0
      addresses: ["{{ lab_config.networks.n6.npe_ipv4 }}/{{ lab_config.networks.n6.subnet.split('/')[1] }}"]
      routes:
        - {to: "{{ lab_config.networks.n6.subnet }}", scope: link, table: 100}
        - {to: "{{ lab_config.networks.ue.pool }}", via: "{{ lab_config.networks.n6.upf_ipv4 }}", table: 100, on_link: true}
  mupc: []
  dn:
    - interface: enp2s0
      addresses: ["{{ lab_config.networks.n6.dn_ipv4 }}/{{ lab_config.networks.n6.subnet.split('/')[1] }}"]
      routes:
        - {to: "{{ lab_config.networks.ue.pool }}", via: "{{ lab_config.networks.n6.npe_ipv4 }}"}


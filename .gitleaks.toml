title = "free5gc-srv6-mup-lab secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Public UERANSIM/free5GC test key used only by the isolated example UE"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = ['''^8baf473f2f8fd09487cccbd7097c6862$''']
paths = [
  '''^config/lab\.example\.yml$''',
  '''^ansible/roles/free5gc/templates/subscriber\.json\.j2$''',
  '''^ansible/roles/ueransim/templates/ue\.yaml\.j2$''',
]
